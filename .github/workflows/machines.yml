name: Machine checks
# Checks every machine in this repository against the Open-XY SDK it targets:
# its records and sources, a browser preview of each synth, its own host tests,
# and a firmware compile with the pinned Blackfin tools. No stock files or device.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  # The Open-XY SDK this repository is checked against. Development follows
  # staging; pin a compatible SDK commit for a release.
  OPEN_XY_REPOSITORY: etcetc000/open-xy
  OPEN_XY_REF: staging
jobs:
  machines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: machines
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.OPEN_XY_REPOSITORY }}
          ref: ${{ env.OPEN_XY_REF }}
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preview and host test tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          python -m pip install numpy==2.3.5
      - name: Generated files are current
        run: |
          python machines/tools/chimes_tables.py "$RUNNER_TEMP/tables.h"
          diff -u machines/machines/chimes/tables.h "$RUNNER_TEMP/tables.h"
          python machines/tools/chimes_panel.py "$RUNNER_TEMP/panel.svg.fragment"
          diff -u machines/machines/chimes/panel.svg.fragment "$RUNNER_TEMP/panel.svg.fragment"
          for machine in stratus cirrus; do
            mkdir -p "$RUNNER_TEMP/$machine"
            python machines/tools/clouds_tables.py "$RUNNER_TEMP/$machine/tables.h"
            diff -u "machines/machines/$machine/tables.h" "$RUNNER_TEMP/$machine/tables.h"
          done
      - name: Machine checks
        shell: bash
        run: |
          args=()
          for record in machines/machines/*/machine.json; do
            args+=(--machine "$(dirname "$record")")
          done
          python open-xy/sdk.py test "${args[@]}" --cxx clang++ --host-cxx g++
  firmware:
    # The pinned Blackfin tools run on Windows x86_64, macOS arm64 and Linux x86_64.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: machines
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.OPEN_XY_REPOSITORY }}
          ref: ${{ env.OPEN_XY_REF }}
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned Blackfin tools
        run: python open-xy/sdk.py toolchain fetch
      - name: Firmware compile with every machine here
        shell: bash
        run: |
          args=()
          for record in machines/machines/*/machine.json; do
            args+=(--machine "$(dirname "$record")")
          done
          python open-xy/sdk.py compile "${args[@]}" --out "$RUNNER_TEMP/module"
